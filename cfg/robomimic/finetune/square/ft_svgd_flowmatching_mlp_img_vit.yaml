defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.train_fm_svgd_img_agent.FMSVGDImgAgent

name: ${env_name}_ft_flowmatching_unet_img
logdir: ${oc.env:DPPO_LOG_DIR}/robomimic-finetune/${env_name}-img/${name}/seed-${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/robomimic-pretrain/square/pre_flowmatching_mlp_img-n8000-c8000/2026-04-16_14-57-00_42/checkpoint/state_8000.pt
robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}-img.json
normalization_path: ${oc.env:DPPO_DATA_DIR}/robomimic/${env_name}-img/normalization.npz

seed: 42
device: cuda:0
env_name: square
obs_dim: 9
action_dim: 7
denoising_steps: 8
cond_steps: 1
img_cond_steps: 1
horizon_steps: 4
act_steps: 4

env:
  n_envs: 64
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 400
  save_video: False
  use_image_obs: True
  wrappers:
    robomimic_image:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                     'robot0_eef_quat',
                     'robot0_gripper_qpos']
      image_keys: ['agentview_image']
      shape_meta: ${shape_meta}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

shape_meta:
  obs:
    rgb:
      shape: [3, 96, 96]
    state:
      shape: [9]
  action:
    shape: [7]

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: robomimic-${env_name}-finetune
  run: ${now:%H-%M-%S}_${name}

train:
  n_train_itr: 201
  n_steps: 200
  n_critic_warmup_itr: 2
  gamma: 0.999
  critic_weight_decay: 0
  save_model_freq: 50
  val_freq: 10
  render:
    freq: 1
    num: 0
  batch_size: 50400
  buffer_num_episode: 10          # number of episodes to store in the buffer for each iteration of training.
  augment: true
  # Q network
  mini_batch_split: 4
  q_update_steps: 512
  new_fraction: 0.33              # fraction of fresh samples in the buffer to use for q update.
  td_lambda: 0.5                  # TD lambda parameter for computing targets. If -1, will use n-step returns. If > 0, will use TD(lambda) returns.
  q_repeat: 16                    # number of iterations to sample from the policy to cmpute targets
  num_trajs: 64                   # number of training trajs
  q_init_std: 0.1
  q_update_lr: 0.001
  q_backbone_lr: 0.00004
  reward_scale: 1.0              # reward scale - positive; negative - EMA normalization
  reward_scale_alpha: 0.01
  q_bootstrap: 2                  # number of actions to bootstrap for in q learning.
  ensemble_q: 2                   # number of q functions in the ensemble
  q_target_mom: 0.995
  weighted_sample: true          # half-half nonzero vs. zero reward traj.
  gradq_net_idx: -1               # -1 -take the average of Q grad; 0 - alternate between Q functions each update
  q_target_max: 1.0         # min-max value to clip the q targets.
  q_target_min: 0.0
  q_mask: True                   # whether to mask out the states after reaching the max reward, to avoid learning from dangling states.
  q_norm_max: 100000.0
  q_norm_min: 0.0
  q_norm_reg: 0.00000001
  # SVGD
  svgd_temp: 0.001                # temp before nabla_x phi(x_i, x_j) - repulsion force
  policy_update_steps: 32
  fm_update_lr: 0.00002
  fm_lr_scheduler:
    warmup_steps: 64
  n_particles: 8                  # number of particles to use for SVGD policy update.
  kl_coef: 0.2                    # KL regularization
  q_norm: svgd
  rbf_bandwith: -1.0
  svgd_type: normal
  consistency_coef: 0.5
  actor_ema_mom: 0.0
  sqrt_distance: false
  # exploration related
  action_sample_noise: 0.02
  sample_mode: full
  # Full Mode
  noise_mode: min_extrp
  epsilon_ratio: 0.2
  # Extrapolate Mode
  # minimum denoising step to apply extrapolation in sampling. Used when sample_mode is extrapolate.
  min_extrp_step: 6
  mean_sampling: false

model:
  _target_: model.diffusion.fm_svgd.FM_SVGD
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.VisionDiffusionMLP
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'} # each image patch is history concatenated
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    augment: False
    spatial_emb: 128
    time_dim: 32
    mlp_dims: [768, 768, 768]
    residual_style: True
    img_cond_steps: ${img_cond_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.ViTCriticObsAct
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'} # each image patch is history concatenated
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    spatial_emb: 128
    dropout: 0
    augment: False
    img_cond_steps: ${img_cond_steps}
    mlp_dims: [256, 256, 256]
    action_dim: ${eval:'${action_dim} * ${act_steps}'} # 28
    double_q: True
    activation_type: SiLU
    residual_style: False
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    use_layernorm: False
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
