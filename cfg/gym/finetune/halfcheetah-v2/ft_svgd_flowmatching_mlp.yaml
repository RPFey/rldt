defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.train_fm_svgd_agent.FMSVGDAgent

name: ${env_name}_ppo_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/gym-finetune/${env_name}/${name}/seed-${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/gym-pretrain/halfcheetah-medium-v2/halfcheetah-medium-v2_pre_flowmatchings_mlp_ta4_td32/2026-04-01_11-31-45_42/checkpoint/state_200.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/gym/${env_name}/normalization.npz

seed: 42
device: cuda:0
env_name: halfcheetah-medium-v2
obs_dim: 17
action_dim: 6
denoising_steps: 8
cond_steps: 1
horizon_steps: 4
act_steps: 4

env:
  n_envs: 100
  name: ${env_name}
  max_episode_steps: 1000
  reset_at_iteration: False
  save_video: False
  best_reward_threshold_for_success: 3  # success rate not relevant for gym tasks
  wrappers:
    mujoco_locomotion_lowdim:
      normalization_path: ${normalization_path}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: gym-${env_name}-finetune
  run: ${now:%H-%M-%S}_${name}

use_tensoarboard: true

train:
  n_train_itr: 71
  n_critic_warmup_itr: 2
  n_steps: 500
  gamma: 0.99
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 10000
    warmup_steps: 10
    min_lr: 1e-6
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 10000
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 100
  val_freq: 5
  render:
    freq: 1
    num: 0
  batch_size: 50400
  buffer_num_episode: 20          # number of episodes to store in the buffer for each iteration of training.
  # Q network
  q_update_steps: 512
  new_fraction: 0.33              # fraction of fresh samples in the buffer to use for q update. 
  td_lambda: 0.0                  # TD lambda parameter for computing targets. If -1, will use n-step returns. If > 0, will use TD(lambda) returns.
  q_repeat: 16                     # number of iterations to sample from the policy to cmpute targets
  q_init_std: 0.1
  q_update_lr: 0.001
  reward_scale: -1.0              # reward scale - positive; negative - EMA normalization
  reward_scale_alpha: 0.01 
  q_bootstrap: 2                  # number of actions to bootstrap for in q learning.
  ensemble_q: 2                   # number of q functions in the ensemble
  q_target_mom: 0.995
  q_split_mode: traj
  weighted_sample: false          # half-half nonzero vs. zero reward traj.
  gradq_net_idx: -1               # -1 -take the average of Q grad; 0 - alternate between Q functions each update
  q_target_max:  1000000          # min-max value to clip the q targets. 
  q_target_min: -1000000
  q_mask: false                   # whether to mask out the states after reaching the max reward, to avoid learning from dangling states.  
  q_norm_max: 100000.0
  q_norm_min: 0.0
  q_norm_reg: 0.00000001
  # SVGD
  svgd_temp: 0.001                # temp before nabla_x phi(x_i, x_j) - repulsion force
  policy_update_steps: 32
  fm_update_lr: 0.00002
  fm_lr_scheduler:
    warmup_steps: 32
  n_particles: 8                  # number of particles to use for SVGD policy update.W
  kl_coef: 0.2                    # KL regularization weight
  q_norm: svgd
  kl_q_weighted: false
  rbf_bandwith: -1.0
  svgd_type: normal
  consistency_coef: 0.5
  sqrt_distance: false
  # exploration related
  action_sample_noise: 0.02
  sample_mode: full
  # Full Mode
  noise_mode: min_extrp
  epsilon_ratio: 0.2
  # Extrapolate Mode
  # minimum denoising step to apply extrapolation in sampling. Used when sample_mode is extrapolate.
  min_extrp_step: 6   
  mean_sampling: true
  rollout_stage_cond: false    
  
model:
  _target_: model.diffusion.fm_svgd.FM_SVGD
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObsAct
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: SiLU
    residual_style: False
    action_dim: ${eval:'${action_dim} * ${act_steps}'} # 80
    double_q: True
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}            # output parameterization; v_pred - predict the velocity; x_pred - predict the clean sample