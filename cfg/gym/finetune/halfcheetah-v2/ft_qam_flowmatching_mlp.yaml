defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.train_fm_qam_agent.QAMAgent

name: ${env_name}_qam_flowmatching_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/gym-finetune/${env_name}/${name}/seed-${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/gym-pretrain/halfcheetah-medium-v2/halfcheetah-medium-v2_pre_flowmatchings_mlp_ta4_td32/2026-04-01_11-31-45_42/checkpoint/state_200.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/gym/${env_name}/normalization.npz

seed: 42
device: cuda:0
env_name: halfcheetah-medium-v2
obs_dim: 17
action_dim: 6
denoising_steps: 8
cond_steps: 1
horizon_steps: 4
act_steps: 4

env:
  n_envs: 100
  name: ${env_name}
  max_episode_steps: 1000
  reset_at_iteration: False
  save_video: False
  best_reward_threshold_for_success: 3  # success rate not relevant for gym tasks
  wrappers:
    mujoco_locomotion_lowdim:
      normalization_path: ${normalization_path}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: gym-${env_name}-finetune
  run: ${now:%H-%M-%S}_${name}

train:
  n_train_itr: 71
  n_critic_warmup_itr: 1
  n_steps: 500
  gamma: 0.99
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 10000
    warmup_steps: 10
    min_lr: 1e-6
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 10000
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 100
  val_freq: 5
  render:
    freq: 1
    num: 0
  batch_size: 50400
  buffer_num_episode: 20          # number of episodes to store in the buffer per iteration
  # Q network
  q_update_steps: 1024
  new_fraction: 0.33
  td_lambda: 0.0
  q_repeat: 16
  q_init_std: 0.1
  q_update_lr: 0.0005
  reward_scale: -1.0
  reward_scale_alpha: 0.01
  q_bootstrap: 2
  ensemble_q: 2
  q_target_mom: 0.998
  q_split_mode: traj
  weighted_sample: false
  gradq_net_idx: -1
  q_target_max: 1000000
  q_target_min: -1000000
  rho: 0.5
  q_mask: false
  q_norm_max: 100000.0
  q_norm_min: 0.0
  q_norm_reg: 0.00000001
  # QAM adjoint matching
  inv_temp: 0.3                   # inverse temperature scaling Q gradient into adjoint init
  clip_adj: true                  # clip actions to [-1,1] before computing Q gradient
  policy_ema_tau: 0.995           # EMA rate for actor (slow) ← actor_ft update; 1.0 = no update, 0.0 = hard copy
  policy_update_steps: 32
  fm_update_lr: 0.00002
  fm_lr_scheduler:
    warmup_steps: 32
  kl_coef: 0.2                    # KL regularization weight (keeps actor_ft close to actor)
  # exploration related
  action_sample_noise: 0.02
  sample_mode: full
  noise_mode: min_extrp
  epsilon_ratio: 0.2
  min_extrp_step: 6
  rollout_stage_cond: false

model:
  _target_: model.diffusion.fm_svgd.FM_SVGD
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObsAct
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: ReLU
    residual_style: False
    action_dim: ${eval:'${action_dim} * ${act_steps}'}
    double_q: True
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
